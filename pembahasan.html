<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapor & Pembahasan Hasil Ujian - CBT System</title>
  
  <link rel="icon" type="image/png" href="asset/Favicon.png">
  
  <!-- Font Modern (Inter) untuk Tampilan Premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- File CSS Modular -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/report.css">
  
  <!-- FontAwesome untuk Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Konfigurasi MathJax v3 (Untuk Rumus Matematika pada Pembahasan) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

  <!-- Container Utama Rapor & Pembahasan -->
  <div id="pembahasan-container" class="premium-report-wrapper" aria-live="polite">
    <div class="report-loading-state">
      <i class="fas fa-spinner fa-spin fa-2x"></i>
      <p>Memuat Rapor & Pembahasan Lengkap...</p>
    </div>
  </div>

  <!-- Script Logika Report -->
  <script src="js/report.js"></script>
</body>
</html>
