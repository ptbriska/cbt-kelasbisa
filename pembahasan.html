<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapor & Pembahasan Hasil Ujian - CBT System</title>
  
  <link rel="icon" type="image/png" href="asset/Favicon.png">
  
  <!-- File CSS Modular -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/report.css">
  
  <!-- FontAwesome untuk Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Konfigurasi MathJax v3 (Untuk Rumus Matematika pada Pembahasan) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body style="background-color: #f4f6f9; min-height: 100vh; padding: 20px 10px;">

  <!-- Container Utama Rapor & Pembahasan -->
  <div id="pembahasan-container">
    <div style="text-align: center; padding: 50px; color: #666;">
      <i class="fas fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top: 10px;">Memuat Rapor & Pembahasan Lengkap...</p>
    </div>
  </div>

  <!-- Script Logika Report -->
  <script src="js/report.js"></script>
</body>
</html>
