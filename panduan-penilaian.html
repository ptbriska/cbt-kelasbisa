Dokumen ini berisi informasi mengenai tipe-tipe soal dan sistem penilaian (*scoring*) yang berlaku dalam sistem Ujian Online / CBT.

---

## 1. Ringkasan Tipe Soal & Sistem Penilaian

### Tipe 1: Single Response (Pilihan Ganda 1 Jawaban)
Pilih **1 jawaban paling tepat** dari pilihan yang tersedia.

* **1A (Standar):** Benar = \`+1\` | Salah = \`0\` | Kosong = \`0\`
* **1B (Sistem Minus):** Benar = \`+4\` | Salah = \`-1\` | Kosong = \`0\` *(Hati-hati dalam menebak jawaban)*
* **1C (Bobot Kesulitan):** Skor disesuaikan dengan tingkat kesulitan soal:
  * *Mudah (Easy)* = \`+1\`
  * *Sedang (Medium)* = \`+3\`
  * *Sulit (Hard)* = \`+5\`
  * *Salah / Kosong* = \`0\`

---

### Tipe 2: Multiple Response (Pilihan Ganda >1 Jawaban)
Pilih **semua opsi yang benar**. Jawaban benar berjumlah lebih dari satu.

* **2A (Equal Credit):** Benar Sempurna (semua opsi tepat) = \`+1\` | Salah / Kurang Tepat / Kosong = \`0\`

---

### Tipe 3: Short Answer (Isian Singkat)
Ketik jawaban langsung pada kolom teks yang disediakan tanpa memilih opsi.

* **3A (Isian Angka):** Masukkan nilai angka presisi. Sesuai = \`+1\` | Salah / Kosong = \`0\`
* **3B (Isian Kata):** Masukkan kata kunci utama. Sesuai = \`+1\` | Salah / Kosong = \`0\` *(Sistem mengabaikan huruf besar/kecil)*

---

### Tipe 4: True / False (Pernyataan Majemuk / Checklist)
Tentukan status **Benar (B)** atau **Salah (S)** pada setiap baris pernyataan yang disediakan.

* **4A (Per Statement):** Penilaian dihitung per baris pernyataan yang dijawab dengan tepat.
  * Tiap baris tepat = \`+1\` (Maksimal skor = total baris)
  * Tiap baris salah / tidak diisi = \`0\`

---

### Tipe 5: Weighted Options (Opsi Berbobot / Skala)
Tipe soal penilaian sikap/karakteristik (misal: Tes Karakteristik Pribadi). 

* **5A (Opsi Berbobot):** Tidak ada jawaban salah (skor 0) kecuali jika soal tidak diisi. Setiap opsi pilihan (A, B, C, D, E) memiliki bobot nilai tersendiri mulai dari **1 hingga 5**.

---

## 2. Tabel Ringkasan Aturan Penilaian

| Kode | Jenis Soal | Cara Menjawab | Skor Benar | Skor Salah | Skor Kosong |
| :---: | :--- | :--- | :---: | :---: | :---: |
| **1A** | Pilihan Ganda | Pilih 1 Jawaban | +1 | 0 | 0 |
| **1B** | Pilihan Ganda (Minus) | Pilih 1 Jawaban | +4 | -1 | 0 |
| **1C** | Pilihan Ganda (Bobot) | Pilih 1 Jawaban | +1 / +3 / +5 | 0 | 0 |
| **2A** | Jawaban Majemuk | Pilih Semua Opsi Benar | +1 | 0 | 0 |
| **3A** | Isian Angka | Ketik Angka | +1 | 0 | 0 |
| **3B** | Isian Kata | Ketik Kata Kunci | +1 | 0 | 0 |
| **4A** | Checklist (B/S) | Pilih B/S per Baris | +1 per baris | 0 | 0 |
| **5A** | Opsi Berbobot (Skala) | Pilih 1 Jawaban | 1 s.d. 5 | 0 | 0 |`;
